name: task_management_system
description: Advanced Kanban Task Management System with sorting and divide-and-conquer utilities
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_slidable: ^3.1.2
  animations: ^2.1.1
  shimmer: ^3.0.0
  syncfusion_flutter_charts: ^23.2.7
  fl_chart: ^0.65.0
  dotted_border: ^2.1.0
  google_fonts: ^6.3.2
  lottie: ^2.7.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
